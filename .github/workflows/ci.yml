# Integración continua del front: en cada PR y en cada push a main o a dev. Las plantillas
# las usan los subsistemas del back, así que lo más importante es correr sus pruebas con este front
# antes de integrarlo, y no recién cuando falla el CI del back.

name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

# Sólo lee el código: ningún trabajo necesita escribir en el repositorio.
permissions:
  contents: read

# Un push nuevo al mismo PR cancela la corrida anterior, que ya no sirve.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secretos:
    name: Secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      # Con todo el historial: un secreto que se agregó y después se borró sigue en un commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Como en el back: la imagen y no gitleaks-action, que en una organización pide licencia, y
      # --redact para que el log público no muestre lo que encuentre.
      - name: Buscar secretos en todo el historial
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --no-banner --redact --verbose

  javascript:
    name: JavaScript (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Sólo las reglas recomendadas (eslint.config.mjs), que encuentran errores y no cuestiones
      # de estilo: un método repetido en una clase, un nombre que no existe, una variable que
      # sobra. Reemplaza al `node --check` de antes, que sólo revisaba la sintaxis.
      - name: Instalar ESLint
        run: npm ci --no-audit --no-fund
      - name: Revisar el JavaScript
        run: npm run js

  css:
    name: CSS (stylelint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Sólo reglas que encuentran errores (.stylelintrc.json), no de estilo: una variable que no
      # existe, una propiedad mal escrita, un selector repetido.
      - name: Instalar stylelint
        run: npm ci --no-audit --no-fund
      - name: Revisar el CSS
        run: npm run css

  plantillas:
    name: Plantillas (compilan)
    runs-on: ubuntu-latest
    steps:
      # Twig no es dependencia del front: lo trae el núcleo del back, con su misma versión.
      # La rama del back con el mismo nombre que ésta, si existe; si no, la rama a la que apunta
      # el PR (dev o main), y si tampoco existe, main. Así un cambio que toca los dos
      # repositorios (las ramas IC-… se llaman igual en los dos) se prueba entero antes de mergear
      # ninguno. Si es la del mismo nombre, se mezcla con esa base antes de probar (IC-453). Las
      # ramas van por env y no en el script, por si traen algo raro.
      - name: Elegir la rama del back
        id: back
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
          BASE: ${{ github.base_ref || github.ref_name }}
        run: |
          existe() {
            git ls-remote --exit-code --heads https://github.com/cerberus-paw/backend-indiecinema.git "refs/heads/$1" >/dev/null
          }
          if existe "$BASE"; then base="$BASE"; else base=main; fi
          if existe "$RAMA"; then ref="$RAMA"; else ref="$base"; fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "Rama del back: $ref (base: $base)"
      - uses: actions/checkout@v7
        with:
          path: frontend-indiecinema
      - uses: actions/checkout@v7
        with:
          repository: cerberus-paw/backend-indiecinema
          ref: ${{ steps.back.outputs.ref }}
          path: backend-indiecinema
          # Con la historia entera: para mezclarla con la base hace falta el ancestro común.
          fetch-depth: 0
      # Una rama del back con el mismo nombre puede haber quedado atrás de la base: sin ponerla al
      # día, el front se prueba contra un back viejo y falla por cosas ajenas al PR (pasó con el
      # #65). Es lo que GitHub ya hace con el propio front al probar un PR.
      - name: Poner al día la rama del back con su base
        if: steps.back.outputs.ref != steps.back.outputs.base
        working-directory: backend-indiecinema
        env:
          BASE: ${{ steps.back.outputs.base }}
        run: |
          git fetch --no-tags origin "$BASE"
          if ! git -c user.name=CI -c user.email=ci@localhost merge --no-edit FETCH_HEAD; then
            echo "::error::La rama del back tiene conflictos con $BASE: hay que ponerla al día antes de probar este PR."
            exit 1
          fi
          git log --oneline -1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring
          coverage: none
          tools: composer:v2
      - name: Instalar Twig con el núcleo
        working-directory: backend-indiecinema/nucleo
        run: composer install --no-dev --no-interaction --no-progress
      - name: Compilar todas las plantillas
        run: php frontend-indiecinema/herramientas/compilar-plantillas.php backend-indiecinema/nucleo/vendor/autoload.php

  pruebas:
    name: Pruebas del back de ${{ matrix.paquete }}
    runs-on: ubuntu-latest
    strategy:
      # Que falle uno no corta los otros: se ve de una vez todo lo que está roto.
      fail-fast: false
      matrix:
        paquete: [nucleo, cuentas, programacion, funciones, moderacion, recaudacion]
    # Las del back corren contra un MySQL de verdad, como en su CI.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: pruebas
          MYSQL_DATABASE: pruebas
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppruebas"
          --health-interval=5s --health-timeout=5s --health-retries=24
    env:
      PRUEBAS_MYSQL_HOST: 127.0.0.1
      PRUEBAS_MYSQL_PUERTO: 3306
      PRUEBAS_MYSQL_CLAVE: pruebas
    steps:
      # El espejo del CI del back: el back con el front de este PR al lado, como en la máquina de
      # cada uno (los subsistemas instalan el front desde ../../frontend-indiecinema).
      # La rama del back con el mismo nombre que ésta, si existe; si no, la rama a la que apunta
      # el PR (dev o main), y si tampoco existe, main. Así un cambio que toca los dos
      # repositorios (las ramas IC-… se llaman igual en los dos) se prueba entero antes de mergear
      # ninguno. Si es la del mismo nombre, se mezcla con esa base antes de probar (IC-453). Las
      # ramas van por env y no en el script, por si traen algo raro.
      - name: Elegir la rama del back
        id: back
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
          BASE: ${{ github.base_ref || github.ref_name }}
        run: |
          existe() {
            git ls-remote --exit-code --heads https://github.com/cerberus-paw/backend-indiecinema.git "refs/heads/$1" >/dev/null
          }
          if existe "$BASE"; then base="$BASE"; else base=main; fi
          if existe "$RAMA"; then ref="$RAMA"; else ref="$base"; fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "Rama del back: $ref (base: $base)"
      - uses: actions/checkout@v7
        with:
          path: frontend-indiecinema
      - uses: actions/checkout@v7
        with:
          repository: cerberus-paw/backend-indiecinema
          ref: ${{ steps.back.outputs.ref }}
          path: backend-indiecinema
          # Con la historia entera: para mezclarla con la base hace falta el ancestro común.
          fetch-depth: 0
      # Una rama del back con el mismo nombre puede haber quedado atrás de la base: sin ponerla al
      # día, el front se prueba contra un back viejo y falla por cosas ajenas al PR (pasó con el
      # #65). Es lo que GitHub ya hace con el propio front al probar un PR.
      - name: Poner al día la rama del back con su base
        if: steps.back.outputs.ref != steps.back.outputs.base
        working-directory: backend-indiecinema
        env:
          BASE: ${{ steps.back.outputs.base }}
        run: |
          git fetch --no-tags origin "$BASE"
          if ! git -c user.name=CI -c user.email=ci@localhost merge --no-edit FETCH_HEAD; then
            echo "::error::La rama del back tiene conflictos con $BASE: hay que ponerla al día antes de probar este PR."
            exit 1
          fi
          git log --oneline -1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_mysql, mbstring, fileinfo
          coverage: none
          tools: composer:v2
      - name: Instalar dependencias
        working-directory: backend-indiecinema/${{ matrix.paquete }}
        run: composer install --no-interaction --no-progress
      - name: Correr las pruebas
        working-directory: backend-indiecinema/${{ matrix.paquete }}
        run: composer pruebas
