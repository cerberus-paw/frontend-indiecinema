# Las pruebas de punta a punta (e2e/README.md) contra el sitio de desarrollo. Las llama el CD del
# back y del front después de desplegar dev, y se pueden correr a mano desde Actions. La URL,
# la cuenta y la función salen del environment desarrollo del repositorio que las corre: el
# repositorio es público y las claves no pueden estar en el código.

name: E2E

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: Pruebas de punta a punta
    runs-on: ubuntu-latest
    # La imagen de Playwright de la misma versión que package.json ya trae Node, Chromium y sus
    # dependencias del sistema (F-02.3): instalarlas con apt en cada corrida dependía de los
    # espejos de Ubuntu, y el 11/11 el e2e cayó cinco veces sin llegar a probar nada porque el
    # runner no los resolvía. Al subir @playwright/test, subir también esta etiqueta.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 15
    environment:
      name: desarrollo
      url: ${{ vars.E2E_URL }}
    steps:
      # Las pruebas de la rama dev del front, aunque las llame el back: son las que van con
      # lo que se acaba de publicar.
      - uses: actions/checkout@v7
        with:
          repository: cerberus-paw/frontend-indiecinema
          ref: dev
      - name: Instalar las dependencias
        run: npm ci --no-audit --no-fund
      - name: Correr las pruebas
        env:
          E2E_URL: ${{ vars.E2E_URL }}
          E2E_FUNCION: ${{ vars.E2E_FUNCION }}
          E2E_CORREO: ${{ secrets.E2E_CORREO }}
          E2E_CLAVE: ${{ secrets.E2E_CLAVE }}
          # Las cuentas del panel, para los anchos del organizador y del administrador (A-3 y
          # A-4). Opcionales: sin ellas, esos casos se saltean.
          E2E_ORGANIZADOR_CORREO: ${{ secrets.E2E_ORGANIZADOR_CORREO }}
          E2E_ORGANIZADOR_CLAVE: ${{ secrets.E2E_ORGANIZADOR_CLAVE }}
          E2E_ADMINISTRADOR_CORREO: ${{ secrets.E2E_ADMINISTRADOR_CORREO }}
          E2E_ADMINISTRADOR_CLAVE: ${{ secrets.E2E_ADMINISTRADOR_CLAVE }}
        run: npm run e2e
      # Sólo las capturas y el error de lo que falló. La traza y el informe HTML quedan afuera: la
      # traza guarda los pedidos, con la contraseña del ingreso y la cookie de la sesión, y los
      # artefactos de un repositorio público los baja cualquiera. La traza completa sale en local.
      - name: Guardar las capturas de lo que falló
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-capturas-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            e2e/resultados/**/*.png
            e2e/resultados/**/error-context.md
          retention-days: 14
          if-no-files-found: ignore
